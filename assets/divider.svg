<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00D9FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1200" height="2" fill="url(#base)"/>
  <rect y="2" width="240" height="2" fill="url(#pulse)">
    <animate attributeName="x" values="-240;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>

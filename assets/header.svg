<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Soumirya Sarangi — AI/ML Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0B1826"/>
      <stop offset="100%" stop-color="#0A2A3D"/>
    </linearGradient>
    <radialGradient id="sweepFill" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.50"/>
      <stop offset="70%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1F6FEB" stroke-width="0.5" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="10"/></clipPath>
    <clipPath id="radarClip"><circle cx="985" cy="150" r="140"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- ── radar assembly ─────────────────────────────── -->
    <g opacity="0.9">
      <circle cx="985" cy="150" r="140" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.16"/>
      <circle cx="985" cy="150" r="102" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.16"/>
      <circle cx="985" cy="150" r="64"  fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.16"/>
      <circle cx="985" cy="150" r="26"  fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.24"/>
      <line x1="845" y1="150" x2="1125" y2="150" stroke="#00D9FF" stroke-width="0.5" opacity="0.14"/>
      <line x1="985" y1="10"  x2="985"  y2="290" stroke="#00D9FF" stroke-width="0.5" opacity="0.14"/>

      <g clip-path="url(#radarClip)">
        <g>
          <path d="M985 150 L985 10 A140 140 0 0 1 1084 51 Z" fill="url(#sweepFill)"/>
          <line x1="985" y1="150" x2="985" y2="10" stroke="#00D9FF" stroke-width="1.5" opacity="0.85"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 985 150" to="360 985 150" dur="7s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- detections -->
      <circle cx="1042" cy="96" r="3" fill="#00D9FF">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="932" cy="204" r="2.5" fill="#00D9FF">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1018" cy="218" r="2" fill="#00D9FF">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" begin="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="922" cy="108" r="2" fill="#00D9FF">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ── drifting scanline ──────────────────────────── -->
    <rect x="0" y="0" width="1200" height="1.5" fill="url(#scanline)">
      <animate attributeName="y" values="-10;310" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- ── corner ticks ───────────────────────────────── -->
    <g stroke="#00D9FF" stroke-width="1.5" opacity="0.5" fill="none">
      <path d="M24 46 L24 24 L46 24"/>
      <path d="M1176 46 L1176 24 L1154 24"/>
      <path d="M24 254 L24 276 L46 276"/>
      <path d="M1176 254 L1176 276 L1154 276"/>
    </g>

    <!-- ── type ───────────────────────────────────────── -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>

      <text x="72" y="96" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
            font-size="12" fill="#8B949E" letter-spacing="3.5">PHAGWARA, PUNJAB · INDIA</text>

      <text x="70" y="163" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
            font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1.4">Soumirya Sarangi</text>

      <rect x="72" y="184" width="86" height="2" fill="url(#rule)"/>

      <text x="72" y="216" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
            font-size="14.5" fill="#00D9FF" letter-spacing="3.2">AI/ML ENGINEER &#160;·&#160; FULL-STACK DEVELOPER</text>

      <text x="72" y="244" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
            font-size="12" fill="#8B949E" letter-spacing="1.5">PyTorch &#160;·&#160; Next.js &#160;·&#160; TypeScript &#160;·&#160; Python</text>
    </g>
  </g>
</svg>

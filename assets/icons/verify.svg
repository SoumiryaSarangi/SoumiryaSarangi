<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Claim verification">
  <defs>
    <filter id="glow-v" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0A3D62" opacity="0.85"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.5"/>
  <!-- speech bubble -->
  <path d="M7 10 h22 a3 3 0 0 1 3 3 v10 a3 3 0 0 1-3 3 H18 l-5 5 v-5 H10 a3 3 0 0 1-3-3 V13 a3 3 0 0 1 3-3 z"
        fill="none" stroke="#00D9FF" stroke-width="1.7" stroke-linejoin="round" filter="url(#glow-v)"/>
  <!-- magnify circle -->
  <circle cx="33" cy="32" r="7" fill="none" stroke="#00D9FF" stroke-width="1.7" filter="url(#glow-v)"/>
  <line x1="38" y1="37" x2="43" y2="42" stroke="#00D9FF" stroke-width="1.7" stroke-linecap="round" filter="url(#glow-v)"/>
  <!-- tick inside magnify -->
  <polyline points="29,32 31.5,34.5 36,29" fill="none" stroke="#00D9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-v)"/>
</svg>

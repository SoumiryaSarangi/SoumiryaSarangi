<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Satellite / radar">
  <defs>
    <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0A3D62" opacity="0.85"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.5"/>
  <!-- satellite body -->
  <rect x="20" y="20" width="8" height="8" rx="1.5" fill="#00D9FF" opacity="0.9" filter="url(#glow-s)"/>
  <!-- solar panels -->
  <rect x="9" y="21" width="9" height="6" rx="1" fill="none" stroke="#00D9FF" stroke-width="1.6" filter="url(#glow-s)"/>
  <rect x="30" y="21" width="9" height="6" rx="1" fill="none" stroke="#00D9FF" stroke-width="1.6" filter="url(#glow-s)"/>
  <!-- antenna -->
  <line x1="24" y1="20" x2="24" y2="13" stroke="#00D9FF" stroke-width="1.6" filter="url(#glow-s)"/>
  <circle cx="24" cy="11" r="2" fill="#00D9FF" filter="url(#glow-s)"/>
  <!-- signal arcs -->
  <path d="M31 36 a9 9 0 0 0-9-9" fill="none" stroke="#00D9FF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" filter="url(#glow-s)"/>
  <path d="M37 40 a15 15 0 0 0-15-15" fill="none" stroke="#00D9FF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" filter="url(#glow-s)"/>
</svg>

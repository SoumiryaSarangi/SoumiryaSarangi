# Place this file at: .github/workflows/snake.yml
# inside the SoumiryaSarangi/SoumiryaSarangi repository.
#
# It regenerates the contribution-snake SVGs every 12 hours and pushes them
# to a branch called `output`, which the README reads from.
#
# After the first run: Settings → Actions → General → Workflow permissions
# must be set to "Read and write permissions".

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: SoumiryaSarangi
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D9FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
